name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install root deps
        run: npm install

      - name: Lint (Expo)
        run: npm run lint

      - name: Backend deps
        working-directory: backend
        run: npm install

      - name: Backend build
        working-directory: backend
        run: npm run build

      - name: Expo doctor (static checks)
        run: npx expo-doctor --non-interactive
